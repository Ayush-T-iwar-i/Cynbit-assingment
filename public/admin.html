<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leads | Cynbit admin</title>
  <meta name="robots" content="noindex">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><a class="logo" href="/">Cynbit</a></header>
  <main style="max-width:1000px">
    <h1>Leads</h1>
    <div class="field">
      <label for="key">Admin key</label>
      <input id="key" type="password" autocomplete="current-password">
    </div>
    <button id="load" class="btn" type="button">Load leads</button>
    <p id="msg" class="status" role="status"></p>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Company</th><th>Industry</th><th>Message</th><th>Status</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script src="admin.js"></script>
</body>
</html>
